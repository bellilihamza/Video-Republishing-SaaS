version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: republish-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: republish
    volumes:
      - mongodb_data:/data/db
    networks:
      - republish-network

  redis:
    image: redis:7.2-alpine
    container_name: republish-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - republish-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: republish-redis-commander
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - republish-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  republish-network:
    driver: bridge
